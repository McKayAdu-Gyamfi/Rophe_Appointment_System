services:
  - type: web
    name: rophe-api
    env: node
    rootDir: server
    buildCommand: npm ci && npm run prisma:generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rophe-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MESSAGE_PROVIDER
        value: noop
      # The delivery webhook is public — this secret is the only thing that
      # stops anyone marking the clinic's messages delivered. Generated per
      # environment; the same value goes in the provider's dashboard.
      - key: MESSAGE_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_DAYS
        value: 7
      - key: INVITE_DAYS
        value: 7

databases:
  - name: rophe-db
    databaseName: rophe
    user: rophe
