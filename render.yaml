services:
  - type: web
    name: rophe-api
    env: node
    rootDir: server
    buildCommand: npm ci && npm run prisma:generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rophe-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MESSAGE_PROVIDER
        value: noop

databases:
  - name: rophe-db
    databaseName: rophe
    user: rophe
